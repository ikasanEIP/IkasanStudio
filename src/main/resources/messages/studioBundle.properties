message.TriggerNowLimitations=<html><b>Check for files</b> fires the consumer''s real scheduled scan once, immediately. The scan still applies the component''s normal acquisition rules:<ul><li><b>File age</b> - files younger than the configured minimum age are ignored (FTP/SFTP default 120 seconds).</li><li><b>Duplicate detection</b> - files already delivered are skipped. Detection compares filename and last-modified date, so touch or replace a file to make it eligible again.</li><li><b>Filename pattern</b> - only files matching the configured pattern are considered.</li><li><b>Asynchronous</b> - the confirmation appears before the scan finishes and does not report how many files were delivered.</li></ul></html>
