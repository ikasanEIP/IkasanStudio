# Base (English) resource bundle for org.ikasan.studio.ui.StudioBundle.
# This file is also the ultimate fallback for any locale that doesn't have its own translation
# (e.g. a key missing from studioBundle_ja.properties resolves here).
#
# Key naming convention: <uiCategory>.<EnglishTextInPascalCase>
# The key deliberately mirrors the English value so it is recognisable without opening this file, e.g.
#   button.Default=Default
#   menu.DeleteComponent=Delete Component
# <uiCategory> prefixes in use:
#   action        - IntelliJ AnAction text/description
#   button        - JButton / clickable label text
#   checkbox      - JCheckBox / JCheckBoxMenuItem text
#   dialog        - Dialog/window title
#   label         - JLabel / static caption text
#   menu          - JMenuItem / JPopupMenu item text
#   message       - Warning/info/error message shown to the user (JOptionPane, notifications, etc.)
#   tab           - Tab title
#   tooltip       - setToolTipText content
#   column        - Table column header

