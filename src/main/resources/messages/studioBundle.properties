label.UserCodeDeletion=User Code Deletion
label.UserCodeDeletionNote=When a component with a hand-editable implementation class is deleted from a flow, Ikasan Studio also deletes that now-unused class from your user source tree. Untick this to delete it automatically without asking.
checkbox.PromptBeforeDeletingUserCode=Prompt before deleting generated code in the user source tree
label.AdvancedControls=Advanced Controls
label.AdvancedControlsNote=Shows rarely-needed controls on the canvas toolbar that most users won't need day to day - currently just "Reload from Disk" (Studio already loads the module automatically on project open; this only reloads model.json from disk after an external change).
checkbox.ShowAdvancedControls=Show advanced controls
label.JmsConnectors=JMS Connectors
label.JmsConnectorsNote=Draws a connector line between a JMS Producer and a JMS Consumer (in a different flow of the same module) that reference the same destination and connection factory - so a "flow A feeds flow B" relationship is visible without building a second flow just to trace it.
checkbox.ShowJmsConnectors=Show JMS destination connectors
label.CanvasLayout=Canvas Layout
label.ComponentDistance=Distance between components:
label.FlowDistance=Distance between flows:
label.FlowXStartPoint=Flow horizontal start position:
label.FlowYStartPoint=Flow vertical start position:
label.CanvasLayoutNote=Adjusts the whitespace used when Studio lays out the canvas. Defaults: 30 px between components, 20 px between flows, and the flows starting 260 px from the left/100 px from the top. Getting-started guidance may temporarily require more space between flows, and setting the horizontal start position too low can crowd each flow's transport-control buttons against its leftmost component.
button.ResetCanvasLayoutDefaults=Reset to defaults
label.TestMailServerLivePolling=Test Mail Server Live Status
label.TestMailServerLivePollingNote=Periodically checks in the background whether a local test mail server is actually running, so the canvas's Test Mail Server node appears/disappears on its own - including if it's stopped some other way, like closing its terminal tab directly. Switch off to only check at the moment you click Start/Stop, if this ever causes a slowdown (e.g. mailSmtpHost pointed somewhere non-local, or local security software intercepting the check).
checkbox.TestMailServerLivePolling=Automatically detect when the test mail server starts or stops
label.FlowErrorMonitoring=Flow Error Monitoring
label.FlowErrorMonitoringNote=While a Studio module process is running, periodically checks its Ikasan REST interface in the background to see whether any flow has stopped in error (as opposed to a clean stop). Flagged flows flash red on the canvas so you notice without watching the console. No REST calls are made between run/debug sessions. Switch off to disable monitoring entirely.
checkbox.FlowErrorMonitoring=Flash flows on the canvas that have stopped in error
label.ModuleDiagramAutoSave=Module Diagram Auto-Save
label.ModuleDiagramAutoSaveNote=When a project with a configured module closes, silently saves its module diagram as a ModuleDiagram-*.png file (named after the module) at the project root - the same file and location "Save image" on the canvas produces. Lets you recognise a module by its diagram thumbnail while browsing project folders on disk, without opening each one in Studio first. Off by default, since it writes a file into the project directory on every close without asking.
checkbox.ModuleDiagramAutoSave=Automatically save a module diagram image when the project closes
