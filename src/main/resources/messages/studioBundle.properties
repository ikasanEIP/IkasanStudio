ai.FileInstructions=Use this option when your AI cannot connect to MCP. Validated proposals apply automatically unless Always ask for approval is enabled or developer-owned code could be replaced. Proposals requiring review follow the steps below.\n\n1. Ask your AI to read generated/IKASAN_STUDIO.md and create a uniquely named .studio-proposal.json file in the project-root ai-proposals/ folder. It must leave the Studio model unchanged.\n2. Click Review changes in the banner at the top of Studio, Review on the notification, or use Tools > Ikasan Studio > Review Latest AI Proposal. To choose another file, use the import button below.\n3. Review the changes and click Apply. Studio updates the design and generates the project files.\n4. Tell the AI that you applied the proposal, so it can read the updated files and continue.\n\nKeep Studio open. This workflow does not require an MCP connection.
