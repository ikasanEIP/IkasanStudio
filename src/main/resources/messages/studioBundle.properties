ai.OnboardingHeading=AI assistance (optional)
ai.OnboardingExplanation=With MCP: connect your AI client to read the live Studio design and propose changes directly.\n\nWithout MCP: your AI writes a proposal file into ai-proposals/. Studio shows a banner so you can review it.\n\nStudio applies validated changes automatically, but always asks before developer-owned code could be replaced. Enable Always ask for approval in Studio settings if you prefer to review every proposal. You can set up AI now; create your module before asking it to change the design.\n\nBefore testing integrations, review and update LOCAL_TEST_ENVIRONMENT.md in the project root. It contains test-service placeholders and credential-reference examples. New projects include it; Studio also creates it when opening an Ikasan project if missing. Your edits are preserved.

ai.SettingsHeading=AI assistance
ai.AlwaysAskApproval=Always ask for approval
ai.ApprovalNote=When off, supported changes that pass validation apply automatically, including new files in ai-proposals/, subject to Confirm deletes below. Potential overwrites of developer-owned code always require review. Automatic changes support Undo.
ai.AutoApplied=AI changes applied automatically and project files generated. Use Undo in Studio to revert. Read the updated files before continuing; incomplete flows cannot run yet.

ai.UserCodeReviewRequired=Approval required: generation has overwrite enabled for developer-owned code. Applying may replace existing implementations, including those in unchanged flows. Check the overwrite choices in Studio before applying.

ai.ConfirmDeletes=Confirm deletes
ai.ConfirmDeletesNote=Ask before AI proposals delete flows or components, or replace components. Applies to MCP and imported proposals. Developer-owned source files are retained.
ai.DeleteReviewRequired=Confirm the deletions listed below. Apply removes these items from the Studio model and regenerates project files. Developer-owned source files are retained. You can undo this change.

